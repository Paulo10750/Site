<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Candy Shop - Home</title>
    <style>
        /* --- ESTILOS GERAIS COMPARTILHADOS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        body {
            background-color: #fff5f7; /* Rosa bem pastel */
            color: #6b5367; /* Roxo acinzentado fofo */
        }

        /* --- TOPO / HEADER --- */
        header {
            background: linear-gradient(135deg, #ffe3ec 0%, #fff0f5 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 4px dashed #ffd1dc;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.3);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .logo-text {
            font-size: 2.2rem;
            color: #ff85a2;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffe3ec;
            font-weight: bold;
        }

        /* --- NAV / MENU CORRIGIDO --- */
        nav {
            margin-top: 10px;
        }

        nav a {
            text-decoration: none;
            color: #7b9acc;
            font-weight: bold;
            padding: 10px 20px;
            margin: 0 8px;
            border-radius: 20px;
            background-color: #fff;
            border: 2px solid #e2ece9;
            transition: all 0.3s ease;
            display: inline-block;
        }

        nav a:hover, nav a.active {
            background-color: #ffccd5;
            color: #fff;
            border-color: #ffb3c1;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(255, 179, 193, 0.4);
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .banner {
            background-color: #fff;
            border: 3px solid #ffe3ec;
            border-radius: 30px;
            padding: 40px 20px;
            box-shadow: 0 8px 20px rgba(255, 204, 213, 0.3);
            background-image: radial-gradient(#fff0f5 20%, transparent 20%), radial-gradient(#fff0f5 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .banner h2 {
            font-size: 2.5rem;
            color: #ff94b3;
            margin-bottom: 15px;
        }

        .banner p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 25px auto;
            line-height: 1.6;
        }

        .btn-magico {
            background: linear-gradient(45deg, #ffb3c1, #ffccd5);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 179, 193, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-magico:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 154, 178, 0.6);
        }

        /* --- RODAPÉ --- */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #bfa8bc;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,5 43,35 57,35" fill="#fff799" stroke="#f4e842" stroke-width="2"/>
                <path d="M25,25 Q35,15 40,40 Z" fill="#ffccd5" />
                <path d="M75,25 Q65,15 60,40 Z" fill="#ffccd5" />
                <circle cx="50" cy="55" r="30" fill="#ffffff" stroke="#ffd1dc" stroke-width="3"/>
                <path d="M33,55 Q40,62 43,55" fill="none" stroke="#6b5367" stroke-width="3" stroke-linecap="round"/>
                <path d="M67,55 Q60,62 57,55" fill="none" stroke="#6b5367" stroke-width="3" stroke-linecap="round"/>
                <circle cx="30" cy="62" r="6" fill="#ff94b3" opacity="0.6"/>
                <circle cx="70" cy="62" r="6" fill="#ff94b3" opacity="0.6"/>
                <path d="M35,30 Q20,45 23,60" fill="none" stroke="#cbf3f0" stroke-width="6" stroke-linecap="round"/>
                <path d="M65,30 Q80,45 77,60" fill="none" stroke="#ffcfd2" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <span class="logo-text">Unicorn Candy</span>
        </div>
        <nav>
            <a href="./" class="active">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <div class="container">
        <div class="banner">
            <h2>Bem-vindo ao Mundo Encantado! 🦄</h2>
            <p>Descubra a coleção mais fofa de doces, acessórios e fofuras espaciais do planeta dos unicórnios. Tudo feito com muito amor e brilho pastel!</p>
            <a href="produtos.html" class="btn-magico">Ver Produtos Mágicos ✨</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Unicorn Candy Shop - Feito com ✨ e 💖
    </footer>

</body>
</html>
