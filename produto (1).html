<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Candy Shop - Produtos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; }
        body { background-color: #fff5f7; color: #6b5367; }
        header { background: linear-gradient(135deg, #ffe3ec 0%, #fff0f5 100%); padding: 20px; text-align: center; border-bottom: 4px dashed #ffd1dc; }
        .logo-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .logo-text { font-size: 2.2rem; color: #ff85a2; font-weight: bold; }
        
        /* Menu corrigido */
        nav a { text-decoration: none; color: #7b9acc; font-weight: bold; padding: 10px 20px; margin: 0 8px; border-radius: 20px; background-color: #fff; border: 2px solid #e2ece9; transition: all 0.3s; display: inline-block; }
        nav a:hover, nav a.active { background-color: #ffccd5; color: #fff; border-color: #ffb3c1; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; color: #ff85a2; margin-bottom: 30px; font-size: 2rem; }
        
        .produtos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card-produto {
            background-color: #fff;
            border: 2px solid #ffccd5;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 6px 15px rgba(255, 179, 193, 0.2);
            transition: transform 0.3s ease;
        }

        .card-produto:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 179, 193, 0.4);
        }

        .img-placeholder {
            width: 100%;
            height: 150px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .p1 { background-color: #e8f0fe; }
        .p2 { background-color: #e6f9ff; }
        .p3 { background-color: #fbf0ff; }

        .card-produto h3 { font-size: 1.3rem; color: #ff85a2; margin-bottom: 8px; }
        .preco { font-size: 1.4rem; font-weight: bold; color: #7b9acc; margin-bottom: 15px; }

        .btn-comprar {
            background-color: #ffccd5;
            color: #6b5367;
            border: 2px solid #ffb3c1;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-comprar:hover { background-color: #ff94b3; color: white; }
        footer { text-align: center; padding: 20px; font-size: 0.9rem; color: #bfa8bc; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,5 43,35 57,35" fill="#fff799" stroke="#f4e842" stroke-width="2"/>
                <path d="M25,25 Q35,15 40,40 Z" fill="#ffccd5" />
                <path d="M75,25 Q65,15 60,40 Z" fill="#ffccd5" />
                <circle cx="50" cy="55" r="30" fill="#ffffff" stroke="#ffd1dc" stroke-width="3"/>
                <path d="M33,55 Q40,62 43,55" fill="none" stroke="#6b5367" stroke-width="3" stroke-linecap="round"/>
                <path d="M67,55 Q60,62 57,55" fill="none" stroke="#6b5367" stroke-width="3" stroke-linecap="round"/>
                <circle cx="30" cy="62" r="6" fill="#ff94b3" opacity="0.6"/>
                <circle cx="70" cy="62" r="6" fill="#ff94b3" opacity="0.6"/>
            </svg>
            <span class="logo-text">Unicorn Candy</span>
        </div>
        <nav>
            <a href="./">Início</a>
            <a href="produtos.html" class="active">Produtos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <div class="container">
        <h2>Nossos Doces e Mimos 🌟</h2>
        <div class="produtos-grid">
            <div class="card-produto">
                <div class="img-placeholder p1">🧁</div>
                <h3>Cupcake Arco-Íris</h3>
                <p class="preco">R$ 12,00</p>
                <button class="btn-comprar" onclick="alert('Adicionado ao carrinho de estrelas! ✨')">Quero este!</button>
            </div>

            <div class="card-produto">
                <div class="img-placeholder p2">🍼</div>
                <h3>Milkshake Estelar</h3>
                <p class="preco">R$ 15,90</p>
                <button class="btn-comprar" onclick="alert('Adicionado ao carrinho de estrelas! ✨')">Quero este!</button>
            </div>

            <div class="card-produto">
                <div class="img-placeholder p3">🧸</div>
                <h3>Pelúcia Nuvem fofa</h3>
                <p class="preco">R$ 49,90</p>
                <button class="btn-comprar" onclick="alert('Adicionado ao carrinho de estrelas! ✨')">Quero este!</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Unicorn Candy Shop - Feito com ✨ e 💖
    </footer>

</body>
</html>
